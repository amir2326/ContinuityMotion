plugins {
    id 'com.android.application'
}

android {
    namespace 'com.continuitymotion.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.continuitymotion.app'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
